# yaml-language-server: $schema=https://raw.githubusercontent.com/yonaskolb/XcodeGen/master/Docs/spec.json
#
# xcodegen spec for FERAL Companion. Regenerate the Xcode project with:
#   ./scripts/bootstrap.sh
#
# This file is the source of truth for the Xcode target. The generated
# .xcodeproj is gitignored; CI and operators always regenerate from this
# spec to avoid pbxproj merge conflicts.
#
# Optional proprietary vendor frameworks (JWBle, Realtek RTK*) are merged
# from project.vendor.generated.yml when present on disk — see
# scripts/generate-vendor-yml.sh and README.md → Vendor SDKs.

include:
  - project.vendor.generated.yml

name: FeralCompanion
options:
  bundleIdPrefix: ai.feral
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
    # Allow the Obj-C JieLi vendor frameworks to load; they ship without
    # bitcode (per the JWBleAdapter wire-up checklist).
    ENABLE_BITCODE: NO

packages: {}

targets:
  FeralCompanion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App/Sources
      - path: Sources/FeralNodeSDK
      # FMDatabaseAdditions is added by project.vendor.generated.yml when
      # JWBle.framework is present (see generate-vendor-yml.sh).
    resources:
      - path: App/Assets.xcassets
      - path: App/LaunchScreen.storyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FERAL
        # Synced with the brain wheel on PyPI (feral-core 2026.5.44).
        # Bumped from 0.1.0 alongside the v1.0 iOS last-mile (S2/S3/S5
        # closures) so TestFlight and the brain agree on the release
        # tag. Bump in lockstep with `feral-core` whenever the iOS
        # wire contract changes.
        CFBundleShortVersionString: "2026.5.44"
        CFBundleVersion: "44"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIRequiredDeviceCapabilities:
          - armv7
        # Privacy / usage strings — required for app review.
        NSCameraUsageDescription: "FERAL uses the camera to scan QR codes for pairing and to share scenes with the FERAL brain."
        NSMicrophoneUsageDescription: "FERAL uses the microphone for voice commands sent to the FERAL brain."
        NSBluetoothAlwaysUsageDescription: "FERAL uses Bluetooth to connect to FERAL-compatible glasses and wristbands."
        NSBluetoothPeripheralUsageDescription: "FERAL uses Bluetooth to connect to FERAL-compatible glasses and wristbands."
        NSHealthShareUsageDescription: "FERAL reads your health data from Apple Health to share with the FERAL brain when you ask it questions about your wellbeing."
        NSHealthUpdateUsageDescription: "FERAL writes summaries to Apple Health when you ask the FERAL brain to log a workout or vital."
        NSLocationWhenInUseUsageDescription: "FERAL shares your approximate location with the FERAL brain for context-aware assistance."
        # Phase 4b skills — Contacts, Apple Music, Calendar usage strings.
        NSContactsUsageDescription: "FERAL looks up your contacts so the brain can resolve \"call John\" or \"email Sarah\" without you having to dictate phone numbers and email addresses."
        NSAppleMusicUsageDescription: "FERAL plays music from your Apple Music library and the Apple Music catalog when you ask the brain to play a song."
        NSCalendarsFullAccessUsageDescription: "FERAL reads and writes events in your Calendar so the brain can answer scheduling questions and add events you ask for."
        NSCalendarsUsageDescription: "FERAL reads and writes events in your Calendar so the brain can answer scheduling questions and add events you ask for."
        # URL scheme for feral:// deep links (pairing payloads).
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: ai.feral.deeplink
            CFBundleURLSchemes:
              - feral
        # Background modes — keep BLE alive when the app is backgrounded.
        UIBackgroundModes:
          - bluetooth-central
          - audio
        ITSAppUsesNonExemptEncryption: false
        # App Transport Security — allow plain HTTP and ws:// to a
        # FERAL brain running on the user's LAN (e.g. 192.168.x.x:9090).
        # iOS 9+ blocks unencrypted connections by default; without
        # this block, URLSessionWebSocketTask silently fails the
        # handshake and the brain sees the connection drop instantly.
        # We use NSAllowsLocalNetworking=true (PRIVATE address ranges
        # only — RFC1918) instead of NSAllowsArbitraryLoads so we
        # don't open up arbitrary HTTP for the rest of the app.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: false
        # iOS 14+ Local Network Privacy — the brain advertises mDNS
        # and lives on the same Wi‑Fi as the phone. Without this
        # purpose string, iOS will deny the connection with a system
        # alert even when ATS allows it.
        NSLocalNetworkUsageDescription: "FERAL needs Local Network access to discover and talk to your FERAL brain on this Wi-Fi. Without it, pairing cannot complete."
        # iOS 17+ enforcement: any NWBrowser started without a matching
        # NSBonjourServices entry is rejected with NoAuth(-65555) and the
        # Local Network permission prompt never fires reliably.
        NSBonjourServices:
          - _feral._tcp
          - _feral-phone._tcp
          - _feral-probe._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.feral.companion
        TARGETED_DEVICE_FAMILY: "1,2"
        # Code signing — automatic with the operator's personal team.
        # Override here if a different team should sign release builds.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V59NQ286UZ
        # HealthKit + Bluetooth + Background Modes capability flags.
        # Capabilities themselves are added via the entitlements file.
        CODE_SIGN_ENTITLEMENTS: App/FeralCompanion.entitlements

  FeralCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests/FeralCompanionTests
    dependencies:
      - target: FeralCompanion
      # Vendor frameworks are added by project.vendor.generated.yml
      # when present on disk.
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FeralCompanion.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FeralCompanion
        # Xcode 26 enforces "every signed bundle has an Info.plist".
        # xcodegen no longer auto-injects one for unit-test bundles, so
        # opt into the synthetic plist explicitly with a stable bundle
        # identifier — otherwise the build dies with
        #   "Cannot code sign because the target does not have an
        #    Info.plist file and one is not being generated automatically"
        # (Xcode 26.4 / iPhone 17 sim, 2026-05-08).
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.feral.companion.tests

schemes:
  FeralCompanion:
    build:
      targets:
        FeralCompanion: all
        FeralCompanionTests: [test]
    test:
      targets:
        - FeralCompanionTests
    run:
      config: Debug
    archive:
      config: Release
